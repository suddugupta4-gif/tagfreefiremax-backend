services:
  - type: web
    name: tagfreefiremax-backend
    env: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tagfreefiremax-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true

databases:
  - name: tagfreefiremax-db
    databaseName: tagfreefiremax
    user: postgres
